# Install, lint and test opsora-cli.
#
# This project declares requires-python >= 3.10, so the original 3.9 matrix entry
# could never install it -- that was the red build. The matrix now covers only
# supported interpreters, and the package is installed (editable) before pytest,
# because the tests import it.
name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio flake8
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install -e .

      - name: Lint for real defects only
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test
        run: python -m pytest -q
