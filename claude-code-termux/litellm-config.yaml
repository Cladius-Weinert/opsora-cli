# Opsora Claude Code — LiteLLM gateway
# Verified against NVIDIA Integrate API 2026-07-27
# Catalog: opsora-cli/claude-code-termux/nvidia-cloud-catalog.json

model_list:
  # ── VERIFIED (Integrate API — account tested) ─────────────────────
  - model_name: opsora-balanced
    litellm_params:
      model: nvidia_nim/meta/llama-3.1-70b-instruct
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: opsora-fast
    litellm_params:
      model: nvidia_nim/meta/llama-3.1-8b-instruct
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: opsora-power
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-pro
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 120

  - model_name: opsora-coder
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-pro
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 120

  - model_name: opsora-reasoning
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 180

  - model_name: opsora-nemotron
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 180

  - model_name: opsora-nano
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-nano-30b-a3b
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: opsora-mistral
    litellm_params:
      model: nvidia_nim/mistralai/mistral-nemotron
      api_key: os.environ/NVIDIA_API_KEY

  # ── NVCF Cloud Functions (NVIDIA Console) ─────────────────────────
  - model_name: opsora-nvcf-gemma
    litellm_params:
      model: nvidia_nim/ai-gemma-2-2b-it
      api_base: https://api.nvcf.nvidia.com/v2/nvcf
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: opsora-nvcf-llama70
    litellm_params:
      model: nvidia_nim/ai-llama-3_1-70b-instruct
      api_base: https://api.nvcf.nvidia.com/v2/nvcf
      api_key: os.environ/NVIDIA_API_KEY

  # ── Optional providers ────────────────────────────────────────────
  - model_name: opsora-qwen-plus
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: opsora-local
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://127.0.0.1:11434

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 120
  cache: true
  cache_params:
    type: local
    ttl: 3600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
