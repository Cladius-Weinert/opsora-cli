[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsora-cli"
version = "3.0.0"
description = "Multi-provider AI coding assistant with a Codex/Cursor-style terminal UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["ai", "coding-assistant", "cli", "terminal", "multi-provider", "llm", "copilot"]
authors = [
    {name = "Opsora", email = "hello@opsora.dev"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "boto3>=1.28.0",
    # Textual powers the new persistent TUI (pinned input). Optional at
    # runtime — the CLI falls back to the classic REPL if it is missing.
    "textual>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

# Catatan: launcher `opsora` disediakan lewat symlink /usr/local/bin/opsora ->
# /opsora/opsora (shebang `env python3` = 3.12, semua deps tersedia). Entry
# console-script pip DIHAPUS agar `pip install` tidak membuat launcher duplikat
# yang memakai python lain (3.14) tanpa dependensi lengkap.

[project.urls]
Homepage = "https://github.com/opsora/opsora-cli"
"Bug Reports" = "https://github.com/opsora/opsora-cli/issues"
Documentation = "https://github.com/opsora/opsora-cli#readme"

[tool.setuptools]
packages = ["opsora_cmd"]
