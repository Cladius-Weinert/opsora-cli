# litellm-docker-compose.yml — VPS / home server for Path B
# Codex (Termux) → https://YOUR_HOST:4000/v1/responses → LiteLLM → NVIDIA + clouds
#
# Quick start:
#   cp litellm.env.example .env
#   # fill NVIDIA_API_KEY, LITELLM_MASTER_KEY, optional cloud keys
#   docker compose -f litellm-docker-compose.yml up -d
#
# Without Docker:
#   export $(grep -v '^#' .env | xargs)
#   pip install 'litellm[proxy]'
#   litellm --config litellm_config.yaml --host 0.0.0.0 --port 4000
#
# Render / cloud note: bind 0.0.0.0 and use $PORT if the platform injects it.

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: codex-litellm-proxy
    restart: unless-stopped
    ports:
      # Host:Container — change host port if 4000 is taken
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      # Ensure keys exist even if .env uses alternate names
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-${TOGETHERAI_API_KEY:-}}
      TOGETHERAI_API_KEY: ${TOGETHERAI_API_KEY:-${TOGETHER_API_KEY:-}}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-change-me}
    command:
      - "--config"
      - "/app/config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=5)\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

# Optional TLS: put Caddy/nginx/Traefik in front and terminate HTTPS,
# then set Termux litellm_proxy.base_url to https://llm.example.com/v1
