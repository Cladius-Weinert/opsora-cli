# ~/.codex/config.toml — USER-LEVEL ONLY (Codex ignores model_providers in project configs)
#
# Three paths:
#   Path C (recommended): Direct NVIDIA NIM — Responses API (tested Codex 0.145)
#   Path A: OpenRouter BYOK — phone-friendly, multi-cloud
#   Path B: LiteLLM VPS proxy — multi-cloud with full control
#
# CRITICAL:
# - wire_api MUST be "responses" (Codex no longer supports "chat")
# - Do NOT use reserved provider ids: openai, ollama, lmstudio
# - Termux: use @mmmbuto/codex-cli-termux (official @openai/codex fails on Bionic)
# - Codex ≥0.134: profiles live in ~/.codex/<name>.config.toml (not [profiles.*] here)
#
# NVIDIA API key: https://build.nvidia.com/settings/api-keys
# OpenRouter BYOK: https://openrouter.ai/settings/integrations

# ── Defaults (Path C — direct NVIDIA, no gateway needed) ────────
model = "deepseek-ai/deepseek-v4-flash"
model_provider = "nvidia_nim"

# ════════════════════════════════════════════════════════════════
# Providers (custom ids only — never openai / ollama / lmstudio)
# ════════════════════════════════════════════════════════════════

# Path C: Direct NVIDIA NIM (Responses API — verified Jul 2026)
# Replaces qwen/qwen3-coder-480b-a35b-instruct (EOL 2026-06-11)
[model_providers.nvidia_nim]
name = "NVIDIA NIM"
base_url = "https://integrate.api.nvidia.com/v1"
env_key = "NVIDIA_API_KEY"
wire_api = "responses"
stream_idle_timeout_ms = 300000

# Path A: OpenRouter (Responses API) + BYOK for NVIDIA
[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"
http_headers = { "HTTP-Referer" = "https://github.com/mmmbuto/codex-cli-termux", "X-Title" = "Codex-Termux-NVIDIA" }

# Path B: remote LiteLLM proxy exposing /v1/responses
# Requires LiteLLM ≥1.94 (client_metadata filter) or ghcr.io/berriai/litellm:main-latest
# Set LITELLM_BASE_URL e.g. https://vps.example.com:4000/v1
[model_providers.litellm_proxy]
name = "LiteLLM Proxy"
base_url = "http://127.0.0.1:4000/v1"  # litellm-proxy-base — run: codex-use-litellm https://VPS:4000/v1
env_key = "LITELLM_API_KEY"
wire_api = "responses"

# ════════════════════════════════════════════════════════════════
# Profiles: see separate files in ~/.codex/<name>.config.toml
# Install script copies dot-codex/*.config.toml automatically.
# Legacy [profiles.*] removed — conflicts with Codex ≥0.134 profile files.
# Termux fork ~0.130: manually add [profiles.*] back if needed.
# ════════════════════════════════════════════════════════════════
